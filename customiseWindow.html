<head>
    <link rel="stylesheet" href="styles.css" />
    <script src="customiseWindow.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<h1>Customise</h1>

<body>

    <h3>Conditions</h3>  
    <div id="conditionsContainer"></div>
    <div class="option-item">
        <input class="input input-narrow" type="text" id="newConditionOptionInput" placeholder="Add new option" />
        <button id="addConditionBtn" class="material-icons add-icon">
            check
        </button>
    </div>
    <hr class="solid">
    <h3>Pattern/Temper Of Game</h3>

    <div id="patternsContainer"></div>
    <div class="option-item">
        <input class="input input-narrow" type="text" id="newPatternOptionInput" placeholder="Add new option" />
        <button id="addPatternBtn" class="material-icons add-icon">
            check
        </button>
    </div>

</body>
